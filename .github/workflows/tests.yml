name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13", "3.14"]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -p no:cacheprovider -rfE --tb=short 2>&1 | tee pytest.log
      - name: Show failing tests as annotations
        if: failure()
        shell: bash
        run: grep -E "^(FAILED|ERROR) |^E  " pytest.log | head -40 | sed 's/^/::error::/' || true
      - name: Smoke run (plays the game headless)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: python tools/smoke.py
